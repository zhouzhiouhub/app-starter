name: Page Builder Visual

on:
  pull_request:
    paths:
      - ".github/workflows/page-builder-visual.yml"
      - "apps/web/**"
      - "packages/renderer/**"
      - "packages/schema/**"
      - "packages/ui/**"
      - "scripts/page-builder-visual-*.mjs"
      - "scripts/visual/**"
      - "docs/development/page-builder-visual-acceptance.*"
      - "docs/visual/page-builder-references/**"
      - "artifacts/visual/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/page-builder-visual.yml"
      - "apps/web/**"
      - "packages/renderer/**"
      - "packages/schema/**"
      - "packages/ui/**"
      - "scripts/page-builder-visual-*.mjs"
      - "scripts/visual/**"
      - "docs/development/page-builder-visual-acceptance.*"
      - "docs/visual/page-builder-references/**"
      - "artifacts/visual/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  page-builder-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:file-size
      - run: pnpm --filter @app-starter/schema build
      - run: pnpm test:visual
      - name: Write visual test diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p reports/visual/page-builder-diagnostics
          {
            echo "## Page Builder Visual Test Diagnostics"
            echo "- Node: \`$(node -v 2>&1)\`"
            echo "- pnpm: \`$(pnpm -v 2>&1)\`"
            echo "- Working directory: \`$(pwd)\`"
            if test -f packages/schema/dist/index.js; then
              echo "- Schema dist: \`present\`"
            else
              echo "- Schema dist: \`missing\`"
            fi
            echo "- Test entry: \`node scripts/visual/run-visual-tests.mjs\`"
            echo "- Diagnostics file: \`reports/visual/page-builder-diagnostics/visual-test-diagnostics.md\`"
            echo "- Rerun log: \`reports/visual/page-builder-diagnostics/test-visual-rerun.log\`"
            echo ""
            echo "### Visual Test Files"
            find scripts/visual -maxdepth 1 -name "*.test.mjs" | sort
          } > reports/visual/page-builder-diagnostics/visual-test-diagnostics.md
          node scripts/visual/run-visual-tests.mjs \
            > reports/visual/page-builder-diagnostics/test-visual-rerun.log 2>&1
          rerun_exit="$?"
          if test "$rerun_exit" != "0"; then
            diagnostic_line="$(
              grep -E "not ok|AssertionError|Cannot find module|ERR_|SyntaxError|TypeError|# fail [1-9][0-9]*|# tests 0" \
                reports/visual/page-builder-diagnostics/test-visual-rerun.log \
                | head -n 1
            )"
            if test -z "$diagnostic_line"; then
              diagnostic_line="$(tail -n 1 reports/visual/page-builder-diagnostics/test-visual-rerun.log)"
            fi
            diagnostic_line="${diagnostic_line//'%'/'%25'}"
            diagnostic_line="${diagnostic_line//$'\r'/'%0D'}"
            diagnostic_line="${diagnostic_line//$'\n'/'%0A'}"
            echo "::error title=Visual test diagnostics::rerun exit $rerun_exit: $diagnostic_line"
          fi
          {
            cat reports/visual/page-builder-diagnostics/visual-test-diagnostics.md
            echo "- Rerun exit code: \`$rerun_exit\`"
            echo ""
            echo "### Rerun Tail"
            echo "\`\`\`text"
            tail -n 120 reports/visual/page-builder-diagnostics/test-visual-rerun.log
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload visual diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: page-builder-visual-diagnostics-${{ github.run_number }}
          path: reports/visual/page-builder-diagnostics
          if-no-files-found: error
          retention-days: 14
      - run: pnpm visual:artifact-bundle -- --artifact-dir reports/visual/page-builder-fixture
        env:
          PAGE_BUILDER_VISUAL_BROWSER: google-chrome
      - name: Write visual evidence summary
        if: always()
        run: |
          {
            echo "## Page Builder Visual Evidence"
            echo "- Bundle: \`pnpm visual:artifact-bundle -- --artifact-dir reports/visual/page-builder-fixture\`"
            echo "- Capture report: \`reports/visual/page-builder-fixture/visual-capture-report.json\`"
            echo "- Reference import report: \`reports/visual/page-builder-fixture/visual-reference-import-report.json\`"
            echo "- Reference import Markdown: \`reports/visual/page-builder-fixture/visual-reference-import-report.md\`"
            echo "- Artifact manifest: \`reports/visual/page-builder-fixture/page-builder-visual-acceptance.json\`"
            echo "- Acceptance report: \`reports/visual/page-builder-fixture/visual-acceptance-report.json\`"
            echo "- Acceptance Markdown: \`reports/visual/page-builder-fixture/visual-acceptance-report.md\`"
            echo "- Artifact check report: \`reports/visual/page-builder-fixture/visual-artifact-check-report.json\`"
            echo "- Artifact check Markdown: \`reports/visual/page-builder-fixture/visual-artifact-check-report.md\`"
            echo "- Artifact: \`page-builder-visual-fixture-${{ github.run_number }}\`"
            echo "- Run id for Production Smoke: \`${{ github.run_id }}\`"
            echo "- Mark reviewed passing evidence with \`pnpm visual:measure -- --write --accept-passing --require-complete\`."
            echo "- Final sign-off still requires real design references and \`pnpm visual:acceptance -- --require-accepted\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload visual fixture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-builder-visual-fixture-${{ github.run_number }}
          path: reports/visual/page-builder-fixture
          if-no-files-found: error
          retention-days: 14
