name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      report_path:
        description: "Safe relative smoke report path"
        required: true
        default: "artifacts/production-smoke/smoke-report.json"
      require_admin_app:
        description: "Require Admin static app smoke"
        required: true
        type: boolean
        default: true
      require_r2_upload:
        description: "Require real R2 upload and CDN smoke"
        required: true
        type: boolean
        default: true
      require_revalidation:
        description: "Require storefront ISR revalidation"
        required: true
        type: boolean
        default: true
      storefront_host:
        description: "Optional public storefront host override"
        required: false
        default: ""
      release_tag:
        description: "Optional release tag for Markdown release notes"
        required: false
        default: ""
      rollback_target:
        description: "Optional rollback target for Markdown release notes"
        required: false
        default: ""
      local_verification_run_url:
        description: "Main CI GitHub Actions run URL for local verification evidence"
        required: false
        default: ""
      local_verification_artifact_name:
        description: "Main CI local verification artifact name"
        required: false
        default: ""
      visual_artifact_name:
        description: "Optional Page Builder Visual artifact name for release notes and evidence"
        required: false
        default: ""
      visual_artifact_run_id:
        description: "Optional Page Builder Visual workflow run id to download evidence"
        required: false
        default: ""
      storefront_url:
        description: "Optional public storefront HTTPS URL for release notes"
        required: false
        default: ""
      release_notes_path:
        description: "Safe relative Markdown release notes path"
        required: false
        default: "artifacts/release/release-notes.md"
      allow_blocked_release_notes:
        description: "Generate release notes as a failure review draft when evidence is blocked"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    environment: production
    env:
      ADMIN_URL: ${{ secrets.PRODUCTION_ADMIN_URL }}
      ANALYTICS_CONSENT_GRANTED: ${{ vars.PRODUCTION_ANALYTICS_CONSENT_GRANTED }}
      ANALYTICS_ENABLED: ${{ vars.PRODUCTION_ANALYTICS_ENABLED }}
      APP_ENV: production
      API_URL: ${{ secrets.PRODUCTION_API_URL }}
      CLARITY_PROJECT_ID: ${{ vars.PRODUCTION_CLARITY_PROJECT_ID }}
      COMMERCE_ENABLED: "false"
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      GA4_MEASUREMENT_ID: ${{ vars.PRODUCTION_GA4_MEASUREMENT_ID }}
      GTM_CONTAINER_ID: ${{ vars.PRODUCTION_GTM_CONTAINER_ID }}
      JWT_PRIVATE_KEY: ${{ secrets.PRODUCTION_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.PRODUCTION_JWT_PUBLIC_KEY }}
      MEDIA_CDN_BASE_URL: ${{ vars.PRODUCTION_MEDIA_CDN_BASE_URL }}
      MEDIA_EXTERNAL_URL_HOSTS: ${{ vars.PRODUCTION_MEDIA_EXTERNAL_URL_HOSTS }}
      MULTI_LOCALE_ENABLED: "false"
      PREVIEW_TOKEN_PREVIOUS_SECRET: ${{ secrets.PRODUCTION_PREVIEW_TOKEN_PREVIOUS_SECRET }}
      PREVIEW_TOKEN_SECRET: ${{ secrets.PRODUCTION_PREVIEW_TOKEN_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.PRODUCTION_R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.PRODUCTION_R2_BUCKET }}
      R2_REGION: ${{ vars.PRODUCTION_R2_REGION }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_R2_SECRET_ACCESS_KEY }}
      REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
      RELEASE_CHECK_ARTIFACT_NAME: release-evidence-check-${{ github.run_number }}
      RELEASE_CHECK_ARTIFACT_PATH: artifacts/release/release-check.json
      RELEASE_CHECK_MARKDOWN_PATH: artifacts/release/release-check.md
      RELEASE_LOCAL_VERIFICATION_ARTIFACT_NAME: ${{ inputs.local_verification_artifact_name }}
      RELEASE_LOCAL_VERIFICATION_RUN_URL: ${{ inputs.local_verification_run_url }}
      RELEASE_NOTES_ARTIFACT_NAME: release-notes-${{ github.run_number }}
      RELEASE_NOTES_ALLOW_BLOCKED: ${{ inputs.allow_blocked_release_notes }}
      RELEASE_NOTES_PATH: ${{ inputs.release_notes_path }}
      RELEASE_PREFLIGHT_ARTIFACT_NAME: release-preflight-${{ github.run_number }}
      RELEASE_PREFLIGHT_MARKDOWN_PATH: artifacts/release/preflight.md
      RELEASE_PREFLIGHT_REPORT_PATH: artifacts/release/preflight.json
      RELEASE_ROLLBACK_TARGET: ${{ inputs.rollback_target }}
      RELEASE_STOREFRONT_URL: ${{ inputs.storefront_url }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VISUAL_ARTIFACT_NAME: ${{ inputs.visual_artifact_name }}
      RELEASE_VISUAL_ARTIFACT_RUN_ID: ${{ inputs.visual_artifact_run_id }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.PRODUCTION_SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_ADMIN_PASSWORD }}
      SMOKE_REPORT_MARKDOWN_PATH: artifacts/production-smoke/smoke-report.md
      SMOKE_REPORT_PATH: ${{ inputs.report_path }}
      SMOKE_REQUIRE_ADMIN_APP: ${{ inputs.require_admin_app }}
      SMOKE_REQUIRE_R2_UPLOAD: ${{ inputs.require_r2_upload }}
      SMOKE_REQUIRE_REVALIDATION: ${{ inputs.require_revalidation }}
      PROJECT_STATUS_ARTIFACT_NAME: project-status-${{ github.run_number }}
      PROJECT_STATUS_ARTIFACT_PATH: artifacts/release/project-status.json
      PROJECT_STATUS_MARKDOWN_PATH: artifacts/release/project-status.md
      SMOKE_REPORT_ARTIFACT_NAME: production-smoke-report-${{ github.run_number }}
      SMOKE_SOURCE_COMMIT_SHA: ${{ github.sha }}
      SMOKE_SOURCE_REPOSITORY: ${{ github.repository }}
      SMOKE_SOURCE_RUN_ID: ${{ github.run_id }}
      SMOKE_SOURCE_RUN_NUMBER: ${{ github.run_number }}
      SMOKE_SOURCE_WORKFLOW: ${{ github.workflow }}
      SMOKE_SOURCE_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SMOKE_STOREFRONT_HOST: ${{ inputs.storefront_host }}
      STOREFRONT_REVALIDATE_SECRET: ${{ secrets.PRODUCTION_STOREFRONT_REVALIDATE_SECRET }}
      STOREFRONT_REVALIDATE_URL: ${{ secrets.PRODUCTION_STOREFRONT_REVALIDATE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}
      WEB_URL: ${{ secrets.PRODUCTION_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:file-size
      - name: Validate release evidence inputs
        run: pnpm release:preflight -- --json-output "$RELEASE_PREFLIGHT_REPORT_PATH" --markdown-output "$RELEASE_PREFLIGHT_MARKDOWN_PATH"
      - name: Download Page Builder visual evidence artifact
        if: ${{ inputs.visual_artifact_name != '' && inputs.visual_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.visual_artifact_name }}
          run-id: ${{ inputs.visual_artifact_run_id }}
          github-token: ${{ github.token }}
          path: reports/visual/page-builder-fixture
      - name: Check Page Builder visual evidence artifact
        if: ${{ inputs.visual_artifact_name != '' && inputs.visual_artifact_run_id != '' }}
        run: pnpm visual:artifact-check -- --artifact-dir reports/visual/page-builder-fixture --markdown-output reports/visual/page-builder-fixture/visual-artifact-check-report.md
      - run: pnpm smoke:publish
      - name: Review archived smoke report
        if: always()
        run: |
          if [ -f "$SMOKE_REPORT_PATH" ]; then
            pnpm smoke:report -- --markdown-output "$SMOKE_REPORT_MARKDOWN_PATH" "$SMOKE_REPORT_PATH"
          else
            echo "Smoke report artifact was not created at $SMOKE_REPORT_PATH."
          fi
      - name: Check release evidence gates
        if: always()
        run: |
          if [ -f "$SMOKE_REPORT_PATH" ]; then
            pnpm smoke:release-check -- "$SMOKE_REPORT_PATH"
          else
            echo "Smoke report artifact was not created at $SMOKE_REPORT_PATH."
            exit 1
          fi
      - name: Write release handoff artifacts
        if: always()
        run: |
          handoff_flags=(
            --require-ready
            --smoke-report "$SMOKE_REPORT_PATH"
            --release-check-output "$RELEASE_CHECK_ARTIFACT_PATH"
            --release-check-markdown "$RELEASE_CHECK_MARKDOWN_PATH"
            --project-status-output "$PROJECT_STATUS_ARTIFACT_PATH"
            --project-status-markdown "$PROJECT_STATUS_MARKDOWN_PATH"
          )
          if [ -n "$RELEASE_VISUAL_ARTIFACT_NAME" ] && [ -n "$RELEASE_VISUAL_ARTIFACT_RUN_ID" ]; then
            handoff_flags+=(--visual-artifact-dir reports/visual/page-builder-fixture)
          fi
          pnpm release:handoff -- "${handoff_flags[@]}"
      - name: Generate release notes
        if: ${{ always() && inputs.release_tag != '' && inputs.rollback_target != '' && inputs.local_verification_run_url != '' && inputs.local_verification_artifact_name != '' && inputs.visual_artifact_name != '' && inputs.visual_artifact_run_id != '' }}
        run: |
          storefront_url="$RELEASE_STOREFRONT_URL"
          if [ -z "$storefront_url" ]; then
            storefront_url="$WEB_URL"
          fi
          release_notes_flags=()
          if [ "$RELEASE_NOTES_ALLOW_BLOCKED" = "true" ]; then
            release_notes_flags+=(--allow-blocked)
          fi

          pnpm release:notes -- \
            "${release_notes_flags[@]}" \
            --release-tag "$RELEASE_TAG" \
            --workflow-run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --local-verification-run-url "$RELEASE_LOCAL_VERIFICATION_RUN_URL" \
            --local-verification-artifact "$RELEASE_LOCAL_VERIFICATION_ARTIFACT_NAME" \
            --smoke-artifact "$SMOKE_REPORT_ARTIFACT_NAME" \
            --preflight-artifact "$RELEASE_PREFLIGHT_ARTIFACT_NAME" \
            --release-artifact "$RELEASE_CHECK_ARTIFACT_NAME" \
            --project-status "$PROJECT_STATUS_ARTIFACT_PATH" \
            --project-status-artifact "$PROJECT_STATUS_ARTIFACT_NAME" \
            --visual-artifact "$RELEASE_VISUAL_ARTIFACT_NAME" \
            --storefront-url "$storefront_url" \
            --rollback-target "$RELEASE_ROLLBACK_TARGET" \
            --release-check "$RELEASE_CHECK_ARTIFACT_PATH" \
            --output "$RELEASE_NOTES_PATH"
      - name: Write release evidence summary
        if: always()
        run: |
          {
            echo "## Production Smoke Evidence"
            echo "- Report path: \`$SMOKE_REPORT_PATH\`"
            echo "- Report Markdown: \`$SMOKE_REPORT_MARKDOWN_PATH\`"
            echo "- Artifact: \`$SMOKE_REPORT_ARTIFACT_NAME\`"
            echo "- Preflight report: \`$RELEASE_PREFLIGHT_REPORT_PATH\`"
            echo "- Preflight Markdown: \`$RELEASE_PREFLIGHT_MARKDOWN_PATH\`"
            echo "- Preflight artifact: \`$RELEASE_PREFLIGHT_ARTIFACT_NAME\`"
            echo "- Source commit: \`${{ github.sha }}\`"
            echo "- Source workflow run: \`https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\`"
            echo "- Review: \`pnpm smoke:report -- $SMOKE_REPORT_PATH\`"
            echo "- Review Markdown: \`pnpm smoke:report -- --markdown-output $SMOKE_REPORT_MARKDOWN_PATH $SMOKE_REPORT_PATH\`"
            echo "- Release gate: \`pnpm smoke:release-check -- $SMOKE_REPORT_PATH\`"
            handoff_gate="pnpm release:handoff -- --require-ready --smoke-report $SMOKE_REPORT_PATH --release-check-output $RELEASE_CHECK_ARTIFACT_PATH --release-check-markdown $RELEASE_CHECK_MARKDOWN_PATH --project-status-output $PROJECT_STATUS_ARTIFACT_PATH --project-status-markdown $PROJECT_STATUS_MARKDOWN_PATH"
            if [ -n "$RELEASE_VISUAL_ARTIFACT_NAME" ] && [ -n "$RELEASE_VISUAL_ARTIFACT_RUN_ID" ]; then
              handoff_gate="$handoff_gate --visual-artifact-dir reports/visual/page-builder-fixture"
            fi
            echo "- Release handoff gate: \`$handoff_gate\`"
            echo "- Combined artifact: \`$RELEASE_CHECK_ARTIFACT_NAME\`"
            echo "- Combined Markdown: \`$RELEASE_CHECK_MARKDOWN_PATH\`"
            echo "- Project status artifact: \`$PROJECT_STATUS_ARTIFACT_NAME\`"
            echo "- Project status Markdown: \`$PROJECT_STATUS_MARKDOWN_PATH\`"
            echo "- Project next actions: \`$PROJECT_STATUS_MARKDOWN_PATH\`"
            if [ -n "$RELEASE_VISUAL_ARTIFACT_NAME" ] && [ -n "$RELEASE_VISUAL_ARTIFACT_RUN_ID" ]; then
              echo "- Visual evidence artifact: \`$RELEASE_VISUAL_ARTIFACT_NAME\` from run \`$RELEASE_VISUAL_ARTIFACT_RUN_ID\`"
              echo "- Visual reference import: \`reports/visual/page-builder-fixture/visual-reference-import-report.md\`"
              echo "- Visual artifact check: \`pnpm visual:artifact-check -- --artifact-dir reports/visual/page-builder-fixture --markdown-output reports/visual/page-builder-fixture/visual-artifact-check-report.md\`"
            else
              echo "- Visual evidence artifact: skipped (set visual_artifact_name and visual_artifact_run_id)"
            fi
            if [ -n "$RELEASE_TAG" ] && [ -n "$RELEASE_ROLLBACK_TARGET" ] && [ -n "$RELEASE_LOCAL_VERIFICATION_RUN_URL" ] && [ -n "$RELEASE_LOCAL_VERIFICATION_ARTIFACT_NAME" ] && [ -n "$RELEASE_VISUAL_ARTIFACT_NAME" ] && [ -n "$RELEASE_VISUAL_ARTIFACT_RUN_ID" ]; then
              echo "- Local verification run: \`$RELEASE_LOCAL_VERIFICATION_RUN_URL\`"
              echo "- Local verification artifact: \`$RELEASE_LOCAL_VERIFICATION_ARTIFACT_NAME\`"
              echo "- Release notes: \`$RELEASE_NOTES_PATH\`"
              echo "- Release notes artifact: \`$RELEASE_NOTES_ARTIFACT_NAME\`"
              if [ "$RELEASE_NOTES_ALLOW_BLOCKED" = "true" ]; then
                echo "- Release notes mode: failure review draft (\`--allow-blocked\`)"
              else
                echo "- Release notes mode: ready evidence only"
              fi
            else
              echo "- Release notes: skipped (set release_tag, rollback_target, local_verification_run_url, local_verification_artifact_name, visual_artifact_name, and visual_artifact_run_id)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload smoke report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SMOKE_REPORT_ARTIFACT_NAME }}
          path: |
            ${{ inputs.report_path }}
            ${{ env.SMOKE_REPORT_MARKDOWN_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload release preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_PREFLIGHT_ARTIFACT_NAME }}
          path: |
            ${{ env.RELEASE_PREFLIGHT_REPORT_PATH }}
            ${{ env.RELEASE_PREFLIGHT_MARKDOWN_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload combined release evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_CHECK_ARTIFACT_NAME }}
          path: |
            ${{ env.RELEASE_CHECK_ARTIFACT_PATH }}
            ${{ env.RELEASE_CHECK_MARKDOWN_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload project status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_STATUS_ARTIFACT_NAME }}
          path: |
            ${{ env.PROJECT_STATUS_ARTIFACT_PATH }}
            ${{ env.PROJECT_STATUS_MARKDOWN_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload release notes artifact
        if: ${{ always() && inputs.release_tag != '' && inputs.rollback_target != '' && inputs.local_verification_run_url != '' && inputs.local_verification_artifact_name != '' && inputs.visual_artifact_name != '' && inputs.visual_artifact_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NOTES_ARTIFACT_NAME }}
          path: ${{ env.RELEASE_NOTES_PATH }}
          if-no-files-found: error
          retention-days: 30
