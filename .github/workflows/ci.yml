name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_starter?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:file-size
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm smoke:report -- --help
      - run: pnpm smoke:release-check -- --help
      - run: pnpm project:status -- --help
      - run: pnpm project:status -- --all-actions --json
      - run: pnpm release:check -- --help
      - run: pnpm release:handoff -- --help
      - run: pnpm release:notes -- --help
      - run: pnpm release:preflight -- --help
      - run: pnpm visual:artifact-bundle -- --help
      - run: pnpm visual:artifact-check -- --help
      - run: pnpm build
      - run: pnpm project:status -- --all-actions --output tmp/project-status.json --markdown-output tmp/project-status-handoff.md
      - name: Upload local verification handoff
        uses: actions/upload-artifact@v4
        with:
          name: local-verification-${{ github.run_number }}
          if-no-files-found: error
          path: |
            tmp/project-status.json
            tmp/project-status-handoff.md
